# Public, anonymous endpoints. Each authorizes the request itself (upload
# token bound to a fresh applicant row / recent-submission check / consent
# token). The gateway JWT check adds nothing here (the anon key is public)
# and rejects callers outright once the project moves to the new
# sb_publishable_ keys, which are not JWTs.
[functions.upload-file]
verify_jwt = false

